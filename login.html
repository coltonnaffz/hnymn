<!doctype html>
<script type="application/json" id="cowork-artifact-meta">
  {
    "name": "hnymn",
    "schemaVersion": 1,
    "description": "Interactive itinerary builder"
  }
</script>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hnymn</title>
    <link
      rel="icon"
      href="https://xhatyapslpxsembgwbdt.supabase.co/storage/v1/object/public/site-assets/icons/hnymn-basic.png"
      type="x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- LOGIN GATE (Stage 1) — shown by default so app content never flashes; JS hides it once authenticated-->
    <div id="login-screen">
      <div class="login-card">
        <div class="login-eyebrow">Private</div>
        <h1 class="login-title">Welcome</h1>
        <p class="login-sub">Please sign in to continue.</p>
        <form id="login-form" class="login-form">
          <input
            type="email"
            id="login-email"
            placeholder="Email"
            autocomplete="username"
            required
          />
          <div class="login-password-wrap">
            <input
              type="password"
              id="login-password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="login-toggle"
              class="login-eye"
              aria-label="Show password"
              title="Show password"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <button type="submit" id="login-btn" class="login-btn">
            Sign In
          </button>
          <div id="login-error" class="login-error"></div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data/supabase-client.js"></script>
    <script>
      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");
      const loginBtn = document.getElementById("login-btn");
      const passwordInput = document.getElementById("login-password");
      const passwordToggle = document.getElementById("login-toggle");

      // Return an already authenticated visitor to the app without showing the form.
      sb.auth
        .getSession()
        .then(({ data: { session } }) => {
          if (session) window.location.replace("index.html");
        })
        // Keep the login page available and report the session restore failure.
        .catch((error) => {
          console.error("Unable to restore the Supabase session:", error);
        });

      // Submit credentials to Supabase and route successful authentication back to the app.
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.textContent = "";
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in…";
        const email = document.getElementById("login-email").value.trim();
        try {
          const { error } = await sb.auth.signInWithPassword({
            email,
            password: passwordInput.value,
          });
          if (error) {
            loginError.textContent = "Incorrect email or password.";
          } else {
            window.location.replace("index.html");
          }
        } catch (error) {
          console.error("Unable to sign in:", error);
          loginError.textContent =
            "Unable to sign in. Please check your connection and try again.";
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign In";
        }
      });

      const EYE_OFF =
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
      const EYE_ON =
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      // Toggle password visibility and keep the button's accessible label in sync.
      passwordToggle.addEventListener("click", () => {
        const reveal = passwordInput.type === "password";
        passwordInput.type = reveal ? "text" : "password";
        passwordToggle.innerHTML = reveal ? EYE_OFF : EYE_ON;
        const label = reveal ? "Hide password" : "Show password";
        passwordToggle.setAttribute("aria-label", label);
        passwordToggle.setAttribute("title", label);
      });
    </script>
  </body>
</html>
